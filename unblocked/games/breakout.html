<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Breaker</title>
<link id="favicon" rel="icon" href="" />
<link rel="stylesheet" href="../styles.css" />
</head>
<body class="game">
<div class="game-wrap">
  <div class="game-bar">
    <a href="../index.html">&larr; Back</a>
    <span id="score">Score 0 &middot; Lives 3 &middot; Best 0</span>
  </div>
  <div class="game-canvas-wrap">
    <canvas id="c" width="480" height="640"></canvas>
    <div id="over" class="overlay" hidden><span id="overText">Space to launch</span></div>
  </div>
  <div class="game-hint">Arrows / mouse. Space launches. Esc to leave.</div>
</div>
<script src="../cloak-inherit.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const PW = 90, PH = 10;
const COLS = 10, ROWS = 6;
const BW = W / COLS, BH = 22;
const COLORS = ['#ef4444','#f59e0b','#eab308','#22c55e','#06b6d4','#a855f7'];
const BEST_KEY = 'breakout.best';
let paddle, ball, bricks, score, lives, best, running, keys = {}, mouseX = null;

function reset(fullReset = true) {
  paddle = { x: W/2 - PW/2, y: H - 30 };
  ball = { x: W/2, y: paddle.y - 10, vx: 0, vy: 0, r: 7, stuck: true };
  if (fullReset) {
    score = 0; lives = 3;
    bricks = [];
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      bricks.push({ x:c*BW, y:50+r*BH, w:BW, h:BH, alive:true, color: COLORS[r%COLORS.length] });
    }
  }
  best = Number(localStorage.getItem(BEST_KEY) || 0);
  updateScore();
  showOverlay('Space to launch');
}
function updateScore(){ document.getElementById('score').textContent = `Score ${score} · Lives ${lives} · Best ${best}`; }

function launch() {
  if (!ball.stuck) return;
  ball.stuck = false;
  const ang = (-Math.PI/2) + (Math.random()*0.6 - 0.3);
  const speed = 5.5;
  ball.vx = Math.cos(ang)*speed;
  ball.vy = Math.sin(ang)*speed;
  hideOverlay();
}

function loop() {
  if (keys['ArrowLeft']) paddle.x -= 7;
  if (keys['ArrowRight']) paddle.x += 7;
  if (mouseX !== null) paddle.x = mouseX - PW/2;
  paddle.x = Math.max(0, Math.min(W - PW, paddle.x));

  if (ball.stuck) {
    ball.x = paddle.x + PW/2;
    ball.y = paddle.y - 10;
  } else {
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx*=-1; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx*=-1; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy*=-1; }
    // paddle hit
    if (ball.y + ball.r >= paddle.y && ball.y < paddle.y + PH &&
        ball.x > paddle.x && ball.x < paddle.x + PW && ball.vy > 0) {
      const rel = (ball.x - (paddle.x + PW/2)) / (PW/2);
      const ang = rel * (Math.PI/3) - Math.PI/2;
      const sp = Math.hypot(ball.vx, ball.vy) * 1.02;
      ball.vx = Math.cos(ang)*sp;
      ball.vy = Math.sin(ang)*sp;
      ball.y = paddle.y - ball.r;
    }
    // bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x+ball.r > b.x && ball.x-ball.r < b.x+b.w && ball.y+ball.r > b.y && ball.y-ball.r < b.y+b.h) {
        b.alive = false; score += 10;
        // bounce direction
        const prevX = ball.x - ball.vx, prevY = ball.y - ball.vy;
        const insideX = prevX > b.x && prevX < b.x+b.w;
        const insideY = prevY > b.y && prevY < b.y+b.h;
        if (insideX) ball.vy *= -1; else if (insideY) ball.vx *= -1; else { ball.vx*=-1; ball.vy*=-1; }
        if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); }
        updateScore();
        break;
      }
    }
    if (ball.y > H + 20) {
      lives--;
      updateScore();
      if (lives <= 0) {
        showOverlay('Game over. Space to restart.');
        running = false;
        reset.next = 'full';
      } else {
        ball.stuck = true;
        showOverlay('Space to launch');
      }
    }
    if (bricks.every(b => !b.alive)) {
      showOverlay('Cleared! Space for next round.');
      reset.next = 'next';
      ball.stuck = true;
    }
  }
  draw();
  requestAnimationFrame(loop);
}
function draw() {
  ctx.fillStyle = '#0a0f1d'; ctx.fillRect(0,0,W,H);
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x+2, b.y+2, b.w-4, b.h-4);
  }
  ctx.fillStyle = '#e8ecf4';
  ctx.fillRect(paddle.x, paddle.y, PW, PH);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
}
function showOverlay(t) { const o=document.getElementById('over'); document.getElementById('overText').textContent=t; o.hidden=false; }
function hideOverlay() { document.getElementById('over').hidden = true; }

document.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ') {
    if (reset.next === 'full') { reset(true); reset.next = null; }
    else if (reset.next === 'next') {
      for (const b of bricks) b.alive = true;
      reset.next = null; showOverlay('Space to launch');
    }
    else launch();
    e.preventDefault();
  }
  if (e.key === 'Escape') window.location.href = '../index.html';
});
document.addEventListener('keyup', (e) => keys[e.key] = false);

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('mouseleave', () => mouseX = null);
canvas.addEventListener('touchmove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  e.preventDefault();
}, {passive:false});

reset(true);
loop();
</script>
</body>
</html>
