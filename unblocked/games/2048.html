<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2048</title>
<link id="favicon" rel="icon" href="" />
<link rel="stylesheet" href="../styles.css" />
<style>
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:#1b2240; padding:10px; border-radius:12px; }
  .cell { width:72px; height:72px; display:grid; place-items:center; background:#0a0f1d; border-radius:8px; font-weight:700; font-size:22px; color:#fff; }
  .v0 { color: transparent; }
  .v2 { background:#eee4da; color:#111; }
  .v4 { background:#ede0c8; color:#111; }
  .v8 { background:#f2b179; }
  .v16 { background:#f59563; }
  .v32 { background:#f67c5f; }
  .v64 { background:#f65e3b; }
  .v128 { background:#edcf72; }
  .v256 { background:#edcc61; }
  .v512 { background:#edc850; }
  .v1024 { background:#edc53f; font-size:19px; }
  .v2048 { background:#edc22e; font-size:19px; }
  .v4096 { background:#3c3a32; font-size:19px; }
</style>
</head>
<body class="game">
<div class="game-wrap">
  <div class="game-bar">
    <a href="../index.html">&larr; Back</a>
    <span id="score">Score: 0 &middot; Best: 0</span>
  </div>
  <div class="game-canvas-wrap">
    <div id="board" class="board"></div>
    <div id="over" class="overlay" hidden><span id="overText"></span></div>
  </div>
  <div class="game-hint">Arrow keys or swipe. R to restart. Esc to leave.</div>
</div>
<script src="../cloak-inherit.js"></script>
<script>
const BEST_KEY = '2048.best';
let grid, score, best, won;

function reset() {
  grid = Array.from({length:4}, () => Array(4).fill(0));
  score = 0;
  won = false;
  best = Number(localStorage.getItem(BEST_KEY) || 0);
  addRandom(); addRandom();
  render();
  hideOverlay();
}
function addRandom() {
  const empties = [];
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (grid[r][c]===0) empties.push([r,c]);
  if (!empties.length) return false;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  grid[r][c] = Math.random()<0.9 ? 2 : 4;
  return true;
}
function render() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    const v = grid[r][c];
    const d = document.createElement('div');
    d.className = 'cell ' + (v?('v'+Math.min(v,4096)):'v0');
    d.textContent = v || '0';
    b.appendChild(d);
  }
  document.getElementById('score').textContent = `Score: ${score} · Best: ${best}`;
}
function slide(row) {
  const a = row.filter(x => x);
  for (let i=0;i<a.length-1;i++) if (a[i]===a[i+1]) { a[i]*=2; score+=a[i]; a[i+1]=0; }
  const b = a.filter(x => x);
  while (b.length<4) b.push(0);
  return b;
}
function rotate(g) {
  const r = Array.from({length:4}, () => Array(4).fill(0));
  for (let i=0;i<4;i++) for (let j=0;j<4;j++) r[j][3-i] = g[i][j];
  return r;
}
function equal(a,b) { for (let i=0;i<4;i++) for (let j=0;j<4;j++) if (a[i][j]!==b[i][j]) return false; return true; }
function move(dir) {
  // dir: 0 left, 1 up, 2 right, 3 down. Rotate so always slide left.
  const before = grid.map(r=>r.slice());
  for (let i=0;i<dir;i++) grid = rotate(grid);
  grid = grid.map(slide);
  for (let i=0;i<(4-dir)%4;i++) grid = rotate(grid);
  if (!equal(before, grid)) {
    addRandom();
    if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); }
    if (!won && grid.flat().includes(2048)) { won = true; showOverlay('2048! Keep going?'); }
    if (!canMove()) showOverlay('No moves. R to restart.');
  }
  render();
}
function canMove() {
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (!grid[r][c]) return true;
    if (c<3 && grid[r][c]===grid[r][c+1]) return true;
    if (r<3 && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}
function showOverlay(t) { const o=document.getElementById('over'); document.getElementById('overText').textContent=t; o.hidden=false; }
function hideOverlay() { document.getElementById('over').hidden = true; }

document.addEventListener('keydown', (e) => {
  const map = { ArrowLeft:0, ArrowUp:1, ArrowRight:2, ArrowDown:3 };
  if (e.key in map) { move(map[e.key]); e.preventDefault(); }
  else if (e.key.toLowerCase() === 'r') reset();
  else if (e.key === 'Escape') window.location.href='../index.html';
});
let ts = null;
document.getElementById('board').addEventListener('touchstart', e => { const t=e.changedTouches[0]; ts={x:t.clientX,y:t.clientY}; }, {passive:true});
document.getElementById('board').addEventListener('touchend', e => {
  if (!ts) return;
  const t=e.changedTouches[0]; const dx=t.clientX-ts.x, dy=t.clientY-ts.y;
  if (Math.abs(dx)<15 && Math.abs(dy)<15) return;
  if (Math.abs(dx)>Math.abs(dy)) move(dx>0?2:0); else move(dy>0?3:1);
  ts=null;
}, {passive:true});

reset();
</script>
</body>
</html>
