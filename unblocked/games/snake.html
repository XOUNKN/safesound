<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Serpent</title>
<link id="favicon" rel="icon" href="" />
<link rel="stylesheet" href="../styles.css" />
</head>
<body class="game">
<div class="game-wrap">
  <div class="game-bar">
    <a href="../index.html">&larr; Back</a>
    <span id="score">Score: 0 &middot; Best: 0</span>
  </div>
  <div class="game-canvas-wrap">
    <canvas id="c" width="480" height="480"></canvas>
    <div id="over" class="overlay" hidden><span id="overText">Press Space</span></div>
  </div>
  <div class="game-hint">Arrows / WASD. Space to pause/restart.</div>
</div>
<script src="../cloak-inherit.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SIZE = 24;        // grid side
const CELL = canvas.width / SIZE;
const BEST_KEY = 'snake.best';

let snake, dir, nextDir, food, score, best, tickMs, timer, dead, paused;

function reset() {
  snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir = {x:1,y:0};
  nextDir = dir;
  placeFood();
  score = 0;
  tickMs = 120;
  dead = false;
  paused = false;
  best = Number(localStorage.getItem(BEST_KEY) || 0);
  updateScore();
  hideOverlay();
  clearInterval(timer);
  timer = setInterval(step, tickMs);
}
function updateScore() {
  document.getElementById('score').textContent = `Score: ${score} · Best: ${best}`;
}
function placeFood() {
  while (true) {
    const f = { x: Math.floor(Math.random()*SIZE), y: Math.floor(Math.random()*SIZE) };
    if (!snake.some(s => s.x===f.x && s.y===f.y)) { food = f; return; }
  }
}
function step() {
  if (paused || dead) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x<0||head.y<0||head.x>=SIZE||head.y>=SIZE) return die();
  if (snake.some(s => s.x===head.x && s.y===head.y)) return die();
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score++;
    if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); }
    updateScore();
    placeFood();
    if (score % 5 === 0 && tickMs > 60) {
      tickMs -= 8;
      clearInterval(timer); timer = setInterval(step, tickMs);
    }
  } else {
    snake.pop();
  }
  draw();
}
function die() {
  dead = true;
  clearInterval(timer);
  showOverlay('Dead. Space to restart.');
}
function draw() {
  ctx.fillStyle = '#0a0f1d';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // food
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
  // snake
  for (let i=0;i<snake.length;i++) {
    const s = snake[i];
    ctx.fillStyle = i===0 ? '#4f8dff' : '#22c55e';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  }
}
function showOverlay(t) {
  const o = document.getElementById('over');
  document.getElementById('overText').textContent = t;
  o.hidden = false;
}
function hideOverlay() { document.getElementById('over').hidden = true; }

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w')    { if (dir.y !== 1) nextDir = {x:0,y:-1}; e.preventDefault(); }
  else if (k === 'arrowdown' || k === 's'){ if (dir.y !==-1) nextDir = {x:0,y:1}; e.preventDefault(); }
  else if (k === 'arrowleft' || k === 'a'){ if (dir.x !== 1) nextDir = {x:-1,y:0}; e.preventDefault(); }
  else if (k === 'arrowright'|| k === 'd'){ if (dir.x !==-1) nextDir = {x:1,y:0}; e.preventDefault(); }
  else if (e.key === ' ') {
    if (dead) reset();
    else { paused = !paused; if (paused) showOverlay('Paused'); else hideOverlay(); }
    e.preventDefault();
  } else if (e.key === 'Escape') {
    window.location.href = '../index.html';
  }
});

// Touch: swipe to turn
let touchStart = null;
canvas.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; touchStart = {x:t.clientX,y:t.clientY}; }, {passive:true});
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
  if (Math.abs(dx) > Math.abs(dy)) nextDir = (dx>0 && dir.x!==-1) ? {x:1,y:0} : (dx<0 && dir.x!==1) ? {x:-1,y:0} : nextDir;
  else nextDir = (dy>0 && dir.y!==-1) ? {x:0,y:1} : (dy<0 && dir.y!==1) ? {x:0,y:-1} : nextDir;
  touchStart = null;
}, {passive:true});

reset();
draw();
</script>
</body>
</html>
